# runs as action_required (never ran). .upptimerc.yml uses no $SECRET headers, so
# nothing needs it. Update Template CI is disabled; this edit persists.
# 2026-09-29 (Jarvis): one retry after 60s — a GitHub API outage page (HttpError
# <!DOCTYPE html>, 2026-07-16) failed the run and emailed Andy. A second failure
# still fails the job, so real breakage is still reported.
